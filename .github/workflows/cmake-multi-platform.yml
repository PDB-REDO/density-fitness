name: multi platform test

on:
  push:
    branches: [ "trunk", "develop" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v3

    - name: Set reusable strings
      id: strings
      shell: bash
      run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install dependencies Ubuntu
      run: >
        sudo apt-get update && sudo apt-get install catch2 nlohmann-json3-dev libeigen3-dev libccp4-dev libclipper-dev libgsl-dev

    - name: Checkout libmcfp
      uses: actions/checkout@v4
      with:
        repository: mhekkel/libmcfp
        path: libmcfp

    - name: Build & install libmcfp
      run: |
        cmake -B ${{github.workspace}}/libmcfp/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -S ${{github.workspace}}/libmcfp -DBUILD_DOCUMENTATION=OFF -DBUILD_TESTING=OFF
        cmake --build ${{github.workspace}}/libmcfp/build
        sudo cmake --install ${{github.workspace}}/libmcfp/build

    - name: Checkout libcifpp
      uses: actions/checkout@v4
      with:
        repository: pdb-redo/libcifpp
        path: libcifpp

    - name: Build & install libcifpp
      run: |
        cmake -B ${{github.workspace}}/libcifpp/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -S ${{github.workspace}}/libcifpp -DBUILD_DOCUMENTATION=OFF -DBUILD_TESTING=OFF
        cmake --build ${{github.workspace}}/libcifpp/build
        sudo cmake --install ${{github.workspace}}/libcifpp/build

    - name: Checkout libpdb-redo
      uses: actions/checkout@v4
      with:
        repository: pdb-redo/libpdb-redo
        path: libpdb-redo

    - name: Build & install libpdb-redo
      run: |
        cmake -B ${{github.workspace}}/libpdb-redo/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -S ${{github.workspace}}/libpdb-redo -DBUILD_DOCUMENTATION=OFF -DBUILD_TESTING=OFF
        cmake --build ${{github.workspace}}/libpdb-redo/build
        sudo cmake --install ${{github.workspace}}/libpdb-redo/build

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_TESTING=ON
        -S ${{ github.workspace }}
        
    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config Release --output-on-failure -R unit-test-density-fitness
      env:
        LIBCIFPP_DATA_DIR: ${{ steps.strings.outputs.build-output-dir }}/_deps/cifpp-src/rsrc

